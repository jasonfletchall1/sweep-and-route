plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'us.northlafayette.sweep'
    compileSdk 34

    defaultConfig {
        applicationId "us.northlafayette.sweep"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.1.2"
    }

    signingConfigs {
        release {
            def ksFile = findProperty('SWEEP_STORE_FILE')
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword findProperty('SWEEP_STORE_PASSWORD')
                keyAlias findProperty('SWEEP_KEY_ALIAS')
                keyPassword findProperty('SWEEP_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (findProperty('SWEEP_STORE_FILE') != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
